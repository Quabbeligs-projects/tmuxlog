# tmuxlog configuration. Copy to ~/.tmuxlog/config.toml; every key is optional
# and the values below are the built-in defaults.

[paths]
# All state lives here (dirs 0700, files 0600). Logs contain secrets verbatim.
root = "~/.tmuxlog"

[capture]
# Boundary marks: "auto" (OSC self-test, sentinel fallback), "osc", "sentinel".
boundary = "auto"
# Per-block cap for master.log / master.clean.log only; raw.bin is never truncated.
max_block_bytes = 104857600
# Output after a command ends is split into orphan blocks at gaps longer than this.
orphan_gap_ms = 500
# Launcher tmux uses to run tmuxlog (pipe-pane capture, arm-new hook). Default:
# this Python running the package from where it is installed. Example:
# cmd = "/usr/local/bin/tmuxlog"
# Commands tagged `interactive: true` in block metadata.
interactive = [
  "ssh", "telnet", "nc", "ncat", "socat", "msfconsole", "evil-winrm",
  "mysql", "psql", "sqlplus", "smbclient", "ftp", "python", "python3",
  "ipython", "vim", "nvim", "vi", "nano", "less", "man", "top", "htop",
  "watch", "tmux", "screen", "bash", "zsh", "sh",
]

[finalize]
# Per-block cap in master.log / master.clean.log (head + tail kept, explicit
# marker; block sha256 is always of the full body). Defaults to
# capture.max_block_bytes.
# cap_bytes = 104857600

[tmux]
# tmux 3.x has no pane-created or after-respawn-pane hook (probed on 3.4 and
# 3.7c); respawn-pane -k keeps the existing pipe, so none is needed.
hooks = ["after-new-session", "after-new-window", "after-split-window"]

[ollama]
# Only loopback endpoints are accepted.
endpoint = "http://127.0.0.1:11434"
model = "mistral"
num_ctx = 32768
prompt_reserve_tokens = 2048
response_reserve_tokens = 4096
# Conservative bytes-per-token estimate used for chunk packing.
bytes_per_token = 3.0
retries = 3
# Collapse carriage-return/backspace overwrites (progress bars) in the text fed
# to `analyze` only. master.clean.log is never collapsed.
collapse_cr = true
